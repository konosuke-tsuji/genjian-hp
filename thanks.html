<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信ありがとうございました｜グループホーム源氏庵</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#fbf9f4;--ink:#2e2a24;--sub:#6b6358;--accent:#8a9a5b;--accent-2:#55603a;--line:#e6e0d4;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","BIZ UDPGothic",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.9}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:48px 32px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05)}
  .mark{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 22px}
  h1{font-size:1.5rem;color:var(--accent-2);margin-bottom:14px;font-weight:700}
  p{color:var(--sub);font-size:1rem;margin-bottom:10px}
  .tel{font-size:1.3rem;font-weight:700;color:var(--accent-2);margin:18px 0 4px}
  .btn{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;text-decoration:none;padding:13px 34px;border-radius:7px;font-weight:600;transition:background .25s}
  .btn:hover{background:var(--ink)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>送信ありがとうございました</h1>
    <p>お問い合わせを受け付けました。<br>担当者より折り返しご連絡いたします。</p>
    <p>お急ぎの場合は、お電話でもお気軽にどうぞ。</p>
    <div class="tel">☎ 055-949-2255</div>
    <p style="font-size:.9rem">受付時間 9:00〜18:00（土日祝も対応します）</p>
    <a class="btn" href="/">トップページへ戻る</a>
  </div>
</body>
</html>
